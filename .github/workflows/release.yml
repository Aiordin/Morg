name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      # 把 base64 的 keystore 还原到 runner 的临时目录。密码只在后续步骤的
      # env 中传递，不写进 GITHUB_ENV，避免特殊字符破坏文件格式。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morg-release.jks"
            echo "MORG_KEYSTORE_FILE=$RUNNER_TEMP/morg-release.jks" >> "$GITHUB_ENV"
            echo "MORG_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APK will be debug-signed."
            echo "MORG_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          MORG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MORG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MORG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease \
            -PmorgVersionName="$VERSION" \
            -PmorgVersionCode="$GITHUB_RUN_NUMBER"

      - name: Package artifacts
        id: package
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          OUT="Morg-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=$OUT.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "${{ steps.package.outputs.apk }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Automated build from tag \`${GITHUB_REF_NAME}\`."
            echo
            echo "- Version: \`${GITHUB_REF_NAME#v}\` (versionCode ${GITHUB_RUN_NUMBER})"
            if [ "${MORG_SIGNED:-false}" = "true" ]; then
              echo "- Signature: release keystore"
            else
              echo "- Signature: debug keystore (no \`ANDROID_KEYSTORE_BASE64\` secret configured)"
            fi
            echo
            echo "Requires Android 10 (API 29) or newer. See the README for setup and limitations."
          } > "$NOTES"

          APK="${{ steps.package.outputs.apk }}"
          SUM="${{ steps.package.outputs.checksum }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$SUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$SUM" \
              --title "Morg ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES"
          fi
